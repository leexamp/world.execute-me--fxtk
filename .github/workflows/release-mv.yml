name: MV Release

on:
  push:
    tags: ['mv-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev gcc-mingw-w64-x86-64 zip

      - name: Build Linux (-Os)
        run: |
          set -e
          CORE="components/fxtk/fxtk.c components/fxtk/fxtk_draw.c components/fxtk/fxtk_widgets.c components/fxtk/fxtk_extra.c components/fxtk/fxtk_effects.c components/fxtk/fxtk_backends.c components/fxtk/fxtk_gesture.c components/fxtk/fxtk_par.c components/fxtk/fxtk_flex.c components/fxtk/fxtk_svg.c"
          mkdir -p dist/pkg-linux
          gcc -DFXTK_MW -Os -ffunction-sections -fdata-sections -Wl,--gc-sections -s             -Icomponents/fxtk -Idrivers -Ithird_party/sokol             mv/pv/v2/single/movie.c drivers/fxtk_sokol_mw.c drivers/fxtk_sokol_driver.c             drivers/fxtk_font_stb.c drivers/fxtk_win.c $CORE             -o dist/movie-linux-x86_64             -lX11 -lXi -lXcursor -lGL -ldl -lpthread -lm
          cp mv/pv/v2/single/BUILD.md mv/pv/v2/single/MAINTENANCE.md dist/pkg-linux/
          cp dist/movie-linux-x86_64 dist/pkg-linux/
          tar -C dist/pkg-linux -czf dist/world-execute-me-mv-v2.5-linux-x86_64.tar.gz .

      - name: Build Windows (-Os)
        run: |
          set -e
          CORE="components/fxtk/fxtk.c components/fxtk/fxtk_draw.c components/fxtk/fxtk_widgets.c components/fxtk/fxtk_extra.c components/fxtk/fxtk_effects.c components/fxtk/fxtk_backends.c components/fxtk/fxtk_gesture.c components/fxtk/fxtk_par.c components/fxtk/fxtk_flex.c components/fxtk/fxtk_svg.c"
          mkdir -p dist/pkg-win
          x86_64-w64-mingw32-gcc -DFXTK_MW -Os -Wl,--gc-sections -s             -Icomponents/fxtk -Idrivers -Ithird_party/sokol             mv/pv/v2/single/movie.c drivers/fxtk_sokol_mw.c drivers/fxtk_sokol_driver.c             drivers/fxtk_font_stb.c drivers/fxtk_win.c $CORE             -o dist/pkg-win/world_execute_me-windows-x64.exe             -lopengl32 -lgdi32 -luser32 -lole32 -loleaut32 -luuid -lshell32 -lwinmm -mwindows
          cp mv/pv/v2/single/BUILD.md mv/pv/v2/single/MAINTENANCE.md dist/pkg-win/
          cd dist/pkg-win && zip -q -r ../world-execute-me-mv-v2.5-windows-x64.zip .

      - name: Checksums
        run: |
          set -e
          cd dist
          sha256sum world-execute-me-mv-v2.5-linux-x86_64.tar.gz world-execute-me-mv-v2.5-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME"             --title "world.execute(me); — 桌面多窗口 MV v2.5（示例程序）"             --notes-file mv/pv/v2/single/RELEASE_v2.5.md             dist/world-execute-me-mv-v2.5-linux-x86_64.tar.gz             dist/world-execute-me-mv-v2.5-windows-x64.zip             dist/SHA256SUMS.txt
